# 18 ターゲットの remapJar を並列実行するとヒープを大量に使う。
org.gradle.jvmargs=-Xmx6G -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# ワーカー数を固定してピークメモリを予測可能にする。
org.gradle.workers.max=4

# Java 25 Toolchain (Minecraft 26.x 用)
org.gradle.java.installations.paths=/home/atsuki/.gradle/jdks/temurin-25

